# for now this is done every time we push
name: Build and publish the ps5-shellui-lock payload

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build the ELF
        run: |
          chmod +x build_sdk.sh
          ./build_sdk.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: payload
          path: lockshellui.elf
          if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: payload
          path: tmp-download/
      - name: Rename artifact
        run: |
          mkdir dist
          cp tmp-download/lockshellui.elf "dist/lockshellui_${{ github.ref_name }}.elf"
      - name: Create GitHub Release (pre-release)
        uses: softprops/action-gh-release@v3
        with:
          name: "Release ${{ github.ref_name }}"
          generate_release_notes: true # Optional: Auto-generates release notes
          files: "dist/lockshellui_${{ github.ref_name }}.elf"
