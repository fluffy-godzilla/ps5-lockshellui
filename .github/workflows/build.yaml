# for now this is done every time we push
name: Build and publish the ps5-shellui-lock payload

# TODO: in the future use the release version from the tag instead of hardcoding it here
env:
  PS5_SHELLUI_LOCK_VERSION: 1.0.1

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Build the ELF
        run: |
          chmod +x build.sh
          ./build.sh "$PS5_SHELLUI_LOCK_VERSION"
      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ps5-shellui-lock_v${{ env.PS5_SHELLUI_LOCK_VERSION }}
          path: ps5-shellui-lock_v${{ env.PS5_SHELLUI_LOCK_VERSION }}.elf
